<!-- No olvides vincular el manifest en el <head> -->
<link rel="manifest" href="manifest.json">
<style>

        box-sizing: border-box;

</style>

<body>

<!-- Top Navigation Bar -->
<div id="topbar">
    <div class="input-group">
        <input id="url" type="text" placeholder="Enter URL (e.g. https://example.com)" />
        <button class="primary" onclick="loadSite()">Inspect</button>
    </div>

    <div class="button-group">
        <button onclick="applyEdit()" title="Apply modified code to live preview">⚡ Apply Code</button>
        <button id="btn-undo" onclick="undo()" title="Undo (Ctrl+Z)">↩ Undo</button>
        <button id="btn-redo" onclick="redo()" title="Redo (Ctrl+Y)">↪ Redo</button>
    </div>

    <div class="button-group">
        <button id="btn-toggle-code" onclick="toggleCodePanel()" class="active" title="Toggle Code Editor Visibility">👁️ Code</button>
        <button id="btn-toggle-preview" onclick="togglePreviewPanel()" class="active" title="Toggle Live Preview Visibility">📱 Preview</button>
        <button id="btn-toggle-console" onclick="toggleConsole()" title="Toggle JS Console">💬 Console <span id="error-badge" class="badge" style="display:none;">0</span></button>
        <button onclick="openAssetsModal()" title="View external images, audio, video files">🖼️ Media Files</button>
    </div>
</div>

<!-- Main Container Split View -->
<div id="main-container">
    <!-- Code Editor Section -->
    <div id="left-panel">
        <div class="panel-header">
            <span>HTML / CSS / JS Source Code</span>
            <span id="line-info">Lines: 1 | Chars: 0</span>
        </div>
        <div class="editor-wrapper">
            <div id="line-numbers" class="line-numbers">1</div>
            <textarea id="code" spellcheck="false" wrap="off" placeholder="Inspected site code will render here..."></textarea>
        </div>
    </div>

    <!-- Live Preview Frame Section -->
    <div id="right-panel">
        <div class="panel-header" style="background:#f6f8fa; color:#57606a; border-bottom:1px solid #d0d7de;">
            <span>Live Interactive Render Box</span>
            <span id="mode-indicator">Mode: Sandbox</span>
        </div>
        <iframe id="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>
    </div>
</div>

<!-- JS Console Panel -->
<div id="console-panel" class="collapsed">
    <div class="console-header">

                <option value="all">All Logs</option>

<!-- Status Bar -->
<div id="status-bar">

        <span id="status">Ready.</span>
    </div>
    <div>
        <span>Web Inspector Sandbox v2.0</span>
    </div>

<script>
let currentMode = "sandbox";
let currentBaseUrl = "";
let errorCount = 0;

// Undo / Redo History Stack State
let historyStack = [];
let historyIndex = -1;
let isUndoRedoOperation = false;
let historyDebounceTimer = null;

// DOM Elements
const codeBox = document.getElementById("code");
const lineNumbers = document.getElementById("line-numbers");
const frame = document.getElementById("frame");
const statusEl = document.getElementById("status");
const leftPanel = document.getElementById("left-panel");
const rightPanel = document.getElementById("right-panel");
const consolePanel = document.getElementById("console-panel");
const consoleLogs = document.getElementById("console-logs");
const errorBadge = document.getElementById("error-badge");
const btnUndo = document.getElementById("btn-undo");
const btnRedo = document.getElementById("btn-redo");

// Initialization
window.addEventListener("DOMContentLoaded", () => {
    updateLineNumbers();
    saveHistoryState(true);
    setupEventListeners();
});

function setupEventListeners() {
    // Line numbers & Undo history tracking
    codeBox.addEventListener("input", () => {
        updateLineNumbers();
        updateLineInfo();
        if (!isUndoRedoOperation) {
            clearTimeout(historyDebounceTimer);
            historyDebounceTimer = setTimeout(() => {
                saveHistoryState();
            }, 300);
        }
    });

    // Sync scroll between textarea and line numbers
    codeBox.addEventListener("scroll", () => {
        lineNumbers.scrollTop = codeBox.scrollTop;
    });

    // Support Tab key inside textarea
    codeBox.addEventListener("keydown", (e) => {
        if (e.key === "Tab") {
            e.preventDefault();
            const start = codeBox.selectionStart;
            const end = codeBox.selectionEnd;
            codeBox.value = codeBox.value.substring(0, start) + "  " + codeBox.value.substring(end);
            codeBox.selectionStart = codeBox.selectionEnd = start + 2;
            updateLineNumbers();
        }

        // Shortcut Keys: Ctrl+Z / Cmd+Z, Ctrl+Y / Cmd+Shift+Z
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
            e.preventDefault();
            if (e.shiftKey) {
                redo();
            } else {
                undo();
            }
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
            e.preventDefault();
            redo();
        }
    });

    // Intercept Console Messages from iFrame Sandbox
    window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "INSPECTOR_CONSOLE") {
            addConsoleLog(event.data.level, event.data.args);
        }
    });
}

/* ==========================================
   1. LOAD SITE & RELATIVE ASSETS RESOLUTION
   ========================================== */
async function loadSite() {
    let url = document.getElementById("url").value.trim();
    if (!url) return;

    if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
        document.getElementById("url").value = url;
    }

    try {
        const parsedUrl = new URL(url);
        currentBaseUrl = parsedUrl.origin + parsedUrl.pathname;
        if (!currentBaseUrl.endsWith('/')) {
            currentBaseUrl = currentBaseUrl.substring(0, currentBaseUrl.lastIndexOf('/') + 1);
        }
    } catch (e) {
        currentBaseUrl = url;
    }

    statusEl.innerText = "Fetching site code...";
    clearConsole();

    try {
        // Fetch site HTML directly via CORS mode
        const res = await fetch(url, { mode: "cors" });
        const html = await res.text();

        codeBox.value = html;
        currentMode = "editable-copy";
        document.getElementById("mode-indicator").innerText = "Mode: CORS Sandbox Copy";
        statusEl.innerText = "Loaded site successfully via CORS mode.";

        applyEdit();
    } catch (e) {
        // CORS Fallback Mode
        frame.src = url;
        codeBox.value = 
`<!-- CORS BLOCKED ❌
This site does not allow direct HTML fetching due to browser security restrictions.

You can still:
1. Inspect & view the live page in the preview pane (right).
2. Paste or write custom HTML/CSS/JS code here to test in sandbox.
3. Media assets and scripts relative to target site are supported.
-->

<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; padding: 2rem; text-align: center; background: #f0f2f5; }
        h2 { color: #d93025; }
        p { color: #5f6368; }
    </style>
</head>
<body>
    <h2>CORS Policy Restriction</h2>
    <p>Target site <b>${url}</b> restricts cross-origin source inspection.</p>
    <p>You can edit this HTML sandbox directly or try another URL!</p>
</body>
</html>`;

        currentMode = "iframe-only";
        document.getElementById("mode-indicator").innerText = "Mode: iFrame Live View";
        statusEl.innerText = "CORS restricted. Running fallback iframe preview mode.";
    }

    updateLineNumbers();
    updateLineInfo();
    saveHistoryState(true);
}

/* Prepare HTML with Base Tag and Console Hook Script */
function injectSandboxScript(rawHtml) {
    let html = rawHtml;

    // Inject <base> tag to resolve relative images, audio, video, css, scripts
    const baseTag = `<base href="${currentBaseUrl || ''}">`;

    // Script to intercept console logs and uncaught errors in sandbox
    const consoleHookScript = `
    <script>
    (function() {
        function serialize(arg) {
            if (arg === undefined) return 'undefined';
            if (arg === null) return 'null';
            if (typeof arg === 'function') return arg.toString();
            if (typeof arg === 'object') {
                try { return JSON.stringify(arg); } catch(e) { return String(arg); }
            }
            return String(arg);
        }

        function sendLog(type, args) {
            try {
                const cleanArgs = Array.from(args).map(serialize);
                window.parent.postMessage({
                    type: 'INSPECTOR_CONSOLE',
                    level: type,
                    args: cleanArgs
                }, '*');
            } catch(e) {}
        }

        const _log = console.log, _warn = console.warn, _error = console.error, _info = console.info;
        console.log = function(...args) { _log.apply(console, args); sendLog('log', args); };
        console.warn = function(...args) { _warn.apply(console, args); sendLog('warn', args); };
        console.error = function(...args) { _error.apply(console, args); sendLog('error', args); };
        console.info = function(...args) { _info.apply(console, args); sendLog('info', args); };

        window.addEventListener('error', function(e) {
            sendLog('error', [e.message + ' (' + e.filename + ':' + e.lineno + ')']);
        });
    })();
    <\/script>
    `;

    if (html.includes("<head>")) {
        return html.replace("<head>", "<head>" + baseTag + consoleHookScript);
    } else if (html.includes("<html>")) {
        return html.replace("<html>", "<html><head>" + baseTag + consoleHookScript + "</head>");
    } else {
        return "<head>" + baseTag + consoleHookScript + "</head>" + html;
    }
}

function applyEdit() {
    const rawCode = codeBox.value;
    const processedCode = injectSandboxScript(rawCode);

    frame.srcdoc = processedCode;
    statusEl.innerText = "Applied updated code to live sandbox preview.";
}

/* ==========================================
   2. UNDO & REDO SYSTEM
   ========================================== */
function saveHistoryState(force = false) {
    const currentCode = codeBox.value;
    if (historyIndex >= 0 && historyStack[historyIndex] === currentCode) return;

    // Truncate any forward redo states
    historyStack = historyStack.slice(0, historyIndex + 1);
    historyStack.push(currentCode);
    historyIndex = historyStack.length - 1;

    updateUndoRedoButtons();
}

function undo() {
    if (historyIndex > 0) {
        historyIndex--;
        isUndoRedoOperation = true;
        codeBox.value = historyStack[historyIndex];
        updateLineNumbers();
        updateLineInfo();
        isUndoRedoOperation = false;
        updateUndoRedoButtons();
        statusEl.innerText = "Undo action performed.";
    }
}

function redo() {
    if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        isUndoRedoOperation = true;
        codeBox.value = historyStack[historyIndex];
        updateLineNumbers();
        updateLineInfo();
        isUndoRedoOperation = false;
        updateUndoRedoButtons();
        statusEl.innerText = "Redo action performed.";
    }
}

function updateUndoRedoButtons() {
    btnUndo.disabled = historyIndex <= 0;
    btnRedo.disabled = historyIndex >= historyStack.length - 1;
}

/* ==========================================
   3. LINE NUMBERING SYSTEM
   ========================================== */
function updateLineNumbers() {
    const lines = codeBox.value.split("\n").length;
    let numbersHtml = "";
    for (let i = 1; i <= lines; i++) {
        numbersHtml += i + "\n";
    }
    lineNumbers.textContent = numbersHtml;
}

function updateLineInfo() {
    const text = codeBox.value;
    const lines = text.split("\n").length;
    const chars = text.length;
    document.getElementById("line-info").innerText = `Lines: ${lines} | Chars: ${chars}`;
}

/* ==========================================
   4. TOGGLE CODE / PREVIEW PANELS
   ========================================== */
function toggleCodePanel() {
    const btn = document.getElementById("btn-toggle-code");
    leftPanel.classList.toggle("hidden");
    btn.classList.toggle("active");
}

function togglePreviewPanel() {
    const btn = document.getElementById("btn-toggle-preview");
    rightPanel.classList.toggle("hidden");
    btn.classList.toggle("active");
}

/* ==========================================
   5. JS CONSOLE SYSTEM
   ========================================== */
function toggleConsole() {
    consolePanel.classList.toggle("collapsed");
}

function clearConsole() {
    consoleLogs.innerHTML = "";
    errorCount = 0;
    updateErrorBadge();
}

function addConsoleLog(level, args) {
    if (level === "error") {
        errorCount++;
        updateErrorBadge();
    }

    const item = document.createElement("div");
    item.className = `log-item ${level}`;
    
    const timeSpan = document.createElement("span");
    timeSpan.className = "log-time";
    timeSpan.innerText = new Date().toLocaleTimeString();

    const messageSpan = document.createElement("span");
    messageSpan.innerText = Array.isArray(args) ? args.join(" ") : args;

    item.appendChild(timeSpan);
    item.appendChild(messageSpan);
    consoleLogs.appendChild(item);
    consoleLogs.scrollTop = consoleLogs.scrollHeight;
}

function updateErrorBadge() {
    if (errorCount > 0) {
        errorBadge.style.display = "inline-block";
        errorBadge.innerText = errorCount;
    } else {
        errorBadge.style.display = "none";
    }
}

function handleConsoleInput(e) {
    if (e.key === "Enter") {
        const input = document.getElementById("console-input");
        const command = input.value.trim();
        if (!command) return;

        addConsoleLog("input", ["> " + command]);
        input.value = "";

        try {
            let result;
            if (frame.contentWindow) {
                result = frame.contentWindow.eval(command);
            } else {
                result = eval(command);
            }
            addConsoleLog("result", ["< " + result]);
        } catch (err) {
            addConsoleLog("error", [err.message]);
        }
    }
}

function filterConsoleLogs() {
    const filter = document.getElementById("console-filter").value;
    const items = consoleLogs.querySelectorAll(".log-item");
    items.forEach(item => {
        if (filter === "all") {
            item.style.display = "flex";
        } else if (item.classList.contains(filter)) {
            item.style.display = "flex";
        } else {
            item.style.display = "none";
        }
    });
}

/* ==========================================
   MEDIA / ASSETS INSPECTOR MODAL
   ========================================== */
function openAssetsModal() {
    const modal = document.getElementById("assets-modal");
    const container = document.getElementById("assets-list");
    container.innerHTML = "";

    const parser = new DOMParser();
    const doc = parser.parseFromString(codeBox.value, "text/html");

    const mediaList = [];

    // Images
    doc.querySelectorAll("img").forEach(img => {
        const src = img.getAttribute("src");
        if (src) mediaList.push({ type: "image", tag: "img", url: resolveUrl(src) });
    });

    // Audio
    doc.querySelectorAll("audio, audio source").forEach(audio => {
        const src = audio.getAttribute("src");
        if (src) mediaList.push({ type: "audio", tag: "audio", url: resolveUrl(src) });
    });

    // Video
    doc.querySelectorAll("video, video source").forEach(video => {
        const src = video.getAttribute("src");
        if (src) mediaList.push({ type: "video", tag: "video", url: resolveUrl(src) });
    });

    if (mediaList.length === 0) {
        container.innerHTML = `<p style="color:#8b949e; text-align:center;">No audio, video, or image media assets found in current HTML source.</p>`;
    } else {
        mediaList.forEach(asset => {
            const div = document.createElement("div");
            div.className = "asset-item";

            const tagClass = asset.type === "image" ? "tag-img" : asset.type === "audio" ? "tag-audio" : "tag-video";

            div.innerHTML = `
                <span class="asset-tag ${tagClass}">${asset.type}</span>
                <span class="asset-info" title="${asset.url}">${asset.url}</span>
                <a href="${asset.url}" target="_blank" style="color:#58a6ff; text-decoration:none; font-size:11px; font-weight:bold;">Open ↗</a>
            `;
            container.appendChild(div);
        });
    }

    modal.style.display = "flex";
}

function resolveUrl(relative) {
    try {
        return new URL(relative, currentBaseUrl || window.location.href).href;
    } catch (e) {
        return relative;
    }
}

function closeAssetsModal() {
    document.getElementById("assets-modal").style.display = "none";
}
